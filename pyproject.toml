[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulate_data"
version = "0.1.0"
description = "A modular library for simulating genomic data for testing bioinformatic tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nathan Mathieu", email = "nmath020@ucr.edu" },
]
dependencies = [
    "pandas>=2.0",
    "biopython>=1.83",
    "pysam>=0.22",
]

[project.scripts]
simulate-data = "simulate_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simulate_data"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
pandas = ">=2.0"
biopython = ">=1.83"
pysam = ">=0.22"
pytest = ">=8.0"
ruff = ">=0.4"
black = ">=24.0"
samtools = ">=1.21"
art = ">=2016.6.5,<2017"
pbsim3 = ">=3.0.5,<4"
# Collapses PBSIM3 multi-pass subread BAMs into PacBio HiFi reads.
pbccs = ">=6.4.0,<7"
survivor = ">=1.0.7,<2"

[tool.pixi.pypi-dependencies]
simulate_data = { path = ".", editable = true }
tevarsim = "*"

[tool.pixi.tasks]
test = { cmd = "pytest tests/ -v" }
lint = { cmd = "ruff check src/ tests/" }
format = { cmd = "black src/ tests/" }

[tool.pytest.ini_options]
markers = ["slow: exercises real external tools (pbsim/ccs)"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 88
target-version = ["py310"]
